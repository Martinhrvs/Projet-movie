<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Détail – CinéDB</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
    <link href="css/style.css" rel="stylesheet"/>
</head>
<body class="detail-page">

<header class="site-header">
    <div class="header-inner container">
        <a aria-label="Accueil CinéDB" class="logo" href="index.html">
            <i class="fa-solid fa-film"></i>
        </a>
        <nav aria-label="Navigation principale" class="main-nav" id="main-nav">
            <a class="nav-link" href="index.html#section-films">Films</a>
            <a class="nav-link" href="index.html#section-series">Séries</a>
            <a class="nav-link" href="index.html#section-tendances">Populaires</a>
        </nav>
        <button aria-controls="main-nav" aria-expanded="false" aria-label="Ouvrir le menu" class="burger-btn"
                id="burger-btn">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>
</header>

<main id="main-content">

    <div aria-label="Chargement en cours" class="loading-spinner" id="loading-spinner">
        <div class="spinner"></div>
    </div>

    <div class="global-error hidden" id="global-error" role="alert">
        <div class="container">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <p id="global-error-msg">Une erreur est survenue.</p>
            <a class="btn-back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Retour à l'accueil</a>
        </div>
    </div>

    <article class="detail-content hidden" id="detail-content">

        <section aria-label="Informations principales" class="detail-hero" id="detail-hero">
            <div class="detail-backdrop" id="detail-backdrop"></div>
            <div class="detail-hero-overlay"></div>
            <div class="container detail-hero-body">
                <div class="detail-poster-wrap">
                    <img alt="Affiche" class="detail-poster" id="detail-poster" loading="lazy" src=""/>
                </div>
                <div class="detail-info">
                    <div class="detail-rating-circle" id="detail-rating">—</div>
                    <h1 class="detail-title" id="detail-title">—</h1>
                    <p class="detail-meta-line" id="detail-meta-line"></p>
                    <h2 class="detail-synopsis-label">Synopsis</h2>
                    <p class="detail-overview" id="detail-overview">—</p>
                </div>
            </div>
        </section>

        <section aria-labelledby="cast-title" class="detail-cast-section" id="detail-cast-section">
            <div class="container">
                <h2 class="section-title" id="cast-title">Casting</h2>
                <div class="cast-grid" id="cast-grid" role="list"></div>
            </div>
        </section>

    </article>

</main>


<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/detail.js"></script>

</body>
</html>
